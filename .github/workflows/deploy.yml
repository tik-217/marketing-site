name: Deploy to Timeweb

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_AUDIT_MODE: live
      - name: Prepare server-side contact configuration
        run: node scripts/contact-config.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
      - name: Install SSH password helper
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy over SSH
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          SSH_HOST_KEY: ${{ vars.SSH_HOST_KEY }}
        run: |
          set -eu
          : "${FTP_SERVER_DIR:?FTP_SERVER_DIR is required}"
          : "${SSH_HOST_KEY:?SSH_HOST_KEY is required}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s %s\n' "$FTP_SERVER" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          sshpass -e rsync -rz --delay-updates \
            -e 'ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts' \
            ./dist/ "${FTP_USERNAME}@${FTP_SERVER}:${FTP_SERVER_DIR}"
